name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Superseded PR runs are cancelled; every push to main is checked to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: Unit tests (100% coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: No coverage ignore comments
        run: |
          if git grep -nE "(v8|c8|istanbul) ignore" -- packages; then
            echo "::error::Coverage ignore comments are not allowed (AGENTS.md → Testy)."
            exit 1
          fi
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  setup:
    name: Setup (npm run setup, twice)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # No `npm ci` here: the installer must work on a fresh checkout, before dependencies.
      - name: First run (fresh checkout)
        shell: bash
        run: npm run setup --silent | tee setup-1.log
      - name: Second run skips every step
        shell: bash
        run: |
          npm run setup --silent | tee setup-2.log
          if grep -q '^✓' setup-2.log; then
            echo "::error::The second npm run setup performed a step — the installer is not idempotent."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: setup-logs
          path: setup-*.log
          if-no-files-found: ignore

  integration:
    name: Integration tests (Testcontainers + agent-browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Use the Chrome preinstalled on the runner instead of downloading one; the Chrome
      # sandbox needs unprivileged user namespaces, which Ubuntu 24.04 restricts.
      AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
      AGENT_BROWSER_ARGS: --no-sandbox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-server-log
          path: tests/integration/server.log
          if-no-files-found: ignore
  tokens:
    name: Wartości spoza tokenów
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Sprawdź komponenty design systemu (kolory, klasy palety, wartości arbitralne, odstępy spoza skali, domyślne skale)
        run: npm run check:tokens -w @gomoku/ui
      - name: Szukaj wartości spoza tokenów
        run: |
          status=0
          grep -rnE '#[0-9a-fA-F]{3,8}\b|(rgba?|hsla?|oklch)\(|-\[[0-9.]+(px|rem)\]|(^|[^-[:alnum:]_])(bg|text|border|ring|fill|stroke|from|via|to)-(slate|gray|zinc|neutral|stone|red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose)-[0-9]{2,3}\b|(^|[^-[:alnum:]_])(bg|text|border)-(white|black)\b' packages/app/src packages/ui/src/game --include='*.tsx' --include='*.css' || status=$?
          if [ "$status" -eq 0 ]; then echo "Znaleziono wartości spoza tokenów"; exit 1; fi
          if [ "$status" -ne 1 ]; then echo "grep nie zadziałał, sprawdź ścieżki"; exit 1; fi

  docker:
    name: Obraz Docker (build + start stosu produkcyjnego)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Zbuduj i uruchom stos z compose.prod.yaml
        env:
          POSTGRES_PASSWORD: ci-only-password
          APP_ORIGIN: http://localhost:3000
          TRUST_PROXY_HOPS: "1"
        run: docker compose -f compose.prod.yaml up -d --build
      - name: Poczekaj na /api/health i sprawdź stronę główną
        run: |
          for attempt in $(seq 1 60); do
            curl --fail --silent http://localhost:3000/api/health && break
            sleep 5
          done
          curl --fail --silent --show-error http://localhost:3000/api/health
          curl --fail --silent --show-error http://localhost:3000/ | grep -q "Gomoku"
      - name: Logi przy błędzie
        if: failure()
        run: docker compose -f compose.prod.yaml logs --no-color
