name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Superseded PR runs are cancelled; every push to main is checked to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: Unit tests (100% coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: No coverage ignore comments
        run: |
          if git grep -nE "(v8|c8|istanbul) ignore" -- packages; then
            echo "::error::Coverage ignore comments are not allowed (AGENTS.md → Testy)."
            exit 1
          fi
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  setup:
    name: Setup (npm run setup, twice)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # No `npm ci` here: the installer must work on a fresh checkout, before dependencies.
      - name: First run (fresh checkout)
        shell: bash
        run: npm run setup --silent | tee setup-1.log
      - name: Second run skips every step
        shell: bash
        run: |
          npm run setup --silent | tee setup-2.log
          if grep -q '^✓' setup-2.log; then
            echo "::error::The second npm run setup performed a step — the installer is not idempotent."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: setup-logs
          path: setup-*.log
          if-no-files-found: ignore

  integration:
    name: Integration tests (Testcontainers + agent-browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Use the Chrome preinstalled on the runner instead of downloading one; the Chrome
      # sandbox needs unprivileged user namespaces, which Ubuntu 24.04 restricts.
      AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
      AGENT_BROWSER_ARGS: --no-sandbox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-server-log
          path: tests/integration/server.log
          if-no-files-found: ignore
