# Local PostgreSQL for development: `docker compose up -d` (or `npm run setup`).
# The project name is pinned so worktrees and clones in other directories share one
# container and volume instead of starting a second, empty database.
name: ai_techleaders_gomoku

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gomoku
      POSTGRES_PASSWORD: gomoku
      POSTGRES_DB: gomoku
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
