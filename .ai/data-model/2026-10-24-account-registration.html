<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model danych: rejestracja konta</title>
<style>
  :root { --bg: #ffffff; --fg: #111827; --edge: #6b7280; --new: #2f6feb; --existing: #e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --fg: #e5e7eb; --edge: #9ca3af; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  header { padding: 8px 16px; }
  svg { width: 100%; height: calc(100% - 48px); cursor: grab; display: block; }
  .node rect { rx: 8; stroke-width: 1.5; }
  .node.new rect { fill: var(--new); stroke: #1b4fb0; }
  .node.new text { fill: #fff; }
  .node.existing rect { fill: var(--existing); stroke: #9ca3af; }
  .edge line { stroke: var(--edge); stroke-width: 1.5; }
  .edge text { fill: var(--fg); font-size: 12px; }
  .dim { opacity: 0.15; }
</style>
</head>
<body>
<header>Model danych — <code>.ai/specs/2026-10-24-account-registration.md</code>. Przeciągnij, aby przesunąć; kółko myszy przybliża; kliknij encję, aby wyróżnić sąsiadów (kliknij tło, aby wyczyścić). Diagram Mermaid w specyfikacji jest nadrzędny.</header>
<svg id="graph" xmlns="http://www.w3.org/2000/svg"><g id="viewport"></g></svg>
<script>
const data = JSON.parse("{\"nodes\":[{\"id\":\"entity_1\",\"label\":\"User (users)\",\"fields\":[\"id uuid\",\"email\",\"displayName\",\"displayNameKey\",\"passwordHash\",\"emailVerifiedAt (null)\",\"createdAt\"],\"kind\":\"new\",\"x\":60,\"y\":60},{\"id\":\"entity_2\",\"label\":\"Session (sessions)\",\"fields\":[\"id uuid\",\"user_id \\u2192 users\",\"tokenHash\",\"createdAt\",\"expiresAt\"],\"kind\":\"new\",\"x\":420,\"y\":60},{\"id\":\"entity_3\",\"label\":\"RateLimitBucket (rate_limit_buckets)\",\"fields\":[\"key\",\"windowStart\",\"count\"],\"kind\":\"new\",\"x\":60,\"y\":300}],\"edges\":[{\"from\":\"entity_1\",\"to\":\"entity_2\",\"label\":\"1-n\"}]}");
const NS = "http://www.w3.org/2000/svg";
const vp = document.getElementById("viewport");
const svg = document.getElementById("graph");
const W = 280, LINE = 18;
const box = {};
const el = (name, attrs) => { const e = document.createElementNS(NS, name); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, String(v)); return e; };

for (const n of data.nodes) box[n.id] = { x: n.x, y: n.y, w: W, h: 34 + n.fields.length * LINE };

const edgeEls = data.edges.map((e) => {
  const a = box[e.from], b = box[e.to];
  const g = el("g", { class: "edge" });
  const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
  g.appendChild(el("line", { x1, y1, x2, y2 }));
  const t = el("text", { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 6, "text-anchor": "middle" });
  t.textContent = e.label;
  g.appendChild(t);
  vp.appendChild(g);
  return { e, g };
});

const nodeEls = data.nodes.map((n) => {
  const b = box[n.id];
  const g = el("g", { class: "node " + (n.kind === "new" ? "new" : "existing"), transform: `translate(${b.x},${b.y})` });
  g.appendChild(el("rect", { width: b.w, height: b.h }));
  const title = el("text", { x: 12, y: 22, "font-weight": "700" });
  title.textContent = n.label;
  g.appendChild(title);
  n.fields.forEach((f, i) => { const t = el("text", { x: 12, y: 44 + i * LINE }); t.textContent = f; g.appendChild(t); });
  g.addEventListener("click", (ev) => { ev.stopPropagation(); focus(n.id); });
  vp.appendChild(g);
  return { n, g };
});

function focus(id) {
  const near = new Set([id]);
  for (const { e } of edgeEls) { if (e.from === id) near.add(e.to); if (e.to === id) near.add(e.from); }
  for (const { n, g } of nodeEls) g.classList.toggle("dim", !near.has(n.id));
  for (const { e, g } of edgeEls) g.classList.toggle("dim", !(e.from === id || e.to === id));
}
svg.addEventListener("click", () => { for (const x of [...nodeEls, ...edgeEls]) x.g.classList.remove("dim"); });

let scale = 1, tx = 0, ty = 0, drag = null;
const apply = () => vp.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
svg.addEventListener("wheel", (ev) => { ev.preventDefault(); scale = Math.min(4, Math.max(0.25, scale * (ev.deltaY < 0 ? 1.1 : 0.9))); apply(); }, { passive: false });
svg.addEventListener("pointerdown", (ev) => { drag = { x: ev.clientX - tx, y: ev.clientY - ty }; });
window.addEventListener("pointermove", (ev) => { if (drag) { tx = ev.clientX - drag.x; ty = ev.clientY - drag.y; apply(); } });
window.addEventListener("pointerup", () => { drag = null; });
apply();
</script>
</body>
</html>
